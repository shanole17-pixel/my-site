<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini App Base</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        :root {
            --bg-color: #161a29;
            --card-bg: #21273a;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --primary: #ffb800;
            --green: #1cc35a;
            --border-color: #323a56;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .header-title { font-size: 18px; font-weight: bold; }
        .balance-badge { color: var(--primary); font-weight: bold; font-size: 14px; }

        /* کارت‌ها و کانتینر */
        .container { padding: 20px; }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        /* دکمه‌ها */
        .btn-primary {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        /* فرم ورود */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px;}
        .input-field {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }
        .input-field:focus { border-color: var(--primary); }

        /* منوی پایین */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 22px; margin-bottom: 4px; }

        /* وضعیت‌ها */
        .hidden { display: none !important; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* صفحه ورود */
        #login-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- ================== صفحه ورود / فعال‌سازی ================== -->
    <div id="login-page">
        <div class="login-logo">🚀</div>
        <h2 style="text-align: center; margin-bottom: 5px;">خوش آمدید</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 14px;">برای ادامه، وارد حساب خود شوید</p>

        <div class="card">
            <div class="input-group">
                <label>شماره موبایل یا نام کاربری</label>
                <input type="text" class="input-field" placeholder="مثلا: 09123456789">
            </div>
            <div class="input-group">
                <label>کد فعال‌سازی / رمز عبور</label>
                <input type="password" class="input-field" placeholder="******">
            </div>
            
            <button class="btn-primary" onclick="loginUser()">
                🔑 ورود به حساب
            </button>
            <button class="btn-secondary" onclick="alert('بخش ثبت‌نام جدید در آینده اضافه می‌شود')">
                ساخت حساب جدید
            </button>
        </div>
    </div>

    <!-- ================== برنامه اصلی (بعد از ورود) ================== -->
    <div id="main-app" class="hidden">
        
        <!-- هدر -->
        <div class="header">
            <div class="header-title" id="page-title">خانه</div>
            <div class="balance-badge">
                💎 ۰ موجودی
            </div>
        </div>

        <div class="container">
            <!-- صفحه خانه -->
            <div id="tab-home">
                <div class="card" style="text-align: center; border-color: var(--primary);">
                    <h3 style="color: var(--primary); margin-bottom: 10px;">👋 سلام کاربر</h3>
                    <p style="color: var(--text-muted); font-size: 14px;">به کارایی جدید خود خوش آمدید.</p>
                    <p style="font-size: 12px; margin-top: 15px; color: var(--text-muted);">(اینجا می‌توانید توضیحات مربوط به ربات یا سرویس خود را قرار دهید)</p>
                </div>

                <div class="grid-2">
                    <div class="card" style="text-align: center;">
                        <h3 style="color: var(--primary);">۰</h3>
                        <p style="color: var(--text-muted); font-size: 12px;">آمار ۱</p>
                    </div>
                    <div class="card" style="text-align: center;">
                        <h3 style="color: var(--green);">۰</h3>
                        <p style="color: var(--text-muted); font-size: 12px;">آمار ۲</p>
                    </div>
                </div>

                <div class="card">
                    <h4 style="margin-bottom: 15px;">دسترسی سریع</h4>
                    <button class="btn-secondary" onclick="alert('عملیات ۱ اجرا شد')">🔹 دکمه کارایی ۱</button>
                    <button class="btn-secondary" onclick="alert('عملیات ۲ اجرا شد')">🔸 دکمه کارایی ۲</button>
                </div>
            </div>

            <!-- صفحه پروفایل / تنظیمات -->
            <div id="tab-profile" class="hidden">
                <div class="card">
                    <h4 style="margin-bottom: 15px;">تنظیمات حساب</h4>
                    <button class="btn-secondary">تغییر اطلاعات</button>
                    <button class="btn-secondary" style="color: #ff4d4d;" onclick="logoutUser()">🚪 خروج از حساب</button>
                </div>
            </div>
        </div>

        <!-- منوی پایین -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home', this)">
                <span>🏠</span>
                <p>خانه</p>
            </div>
            <div class="nav-item" onclick="switchTab('profile', this)">
                <span>👤</span>
                <p>پروفایل</p>
            </div>
        </div>
    </div>

    <script>
        // اینیت تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#161a29');
        tg.setBackgroundColor('#161a29');

        // منطق ورود
        function loginUser() {
            const inputs = document.querySelectorAll('.input-field');
            const user = inputs[0].value;
            const pass = inputs[1].value;

            // اینجا می‌توانید درخواست به بک‌اند بفرستید
            if(user && pass) { 
                // انتقال به برنامه اصلی
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
            } else {
                alert('لطفا فیلدها را پر کنید');
            }
        }

        // منطق خروج
        function logoutUser() {
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
        }

        // تغییر تب‌ها
        function switchTab(tabName, element) {
            // مخفی کردن همه تب‌ها
            document.getElementById('tab-home').classList.add('hidden');
            document.getElementById('tab-profile').classList.add('hidden');
            
            // نمایش تب انتخاب شده
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            // تغییر عنوان هدر
            document.getElementById('page-title').innerText = element.querySelector('p').innerText;

            // مدیریت استایل منوی پایین
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
